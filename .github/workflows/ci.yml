name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword

        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest

      - name: Run flake8
        run: flake8 app/

      - name: Run pytest
        run: pytest app/
        env:
          DB_HOST: localhost
          DB_NAME: appdb
          DB_USER: appuser
          DB_PASSWORD: apppassword

  terraform-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validation
        working-directory: terraform
        run: terraform validate

  stack-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create .env
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Prometheus Config
        run: |
          docker compose run --rm --no-deps \
          --entrypoint promtool \
          prometheus check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config
        run: |
          docker compose run --rm --no-deps \
          --entrypoint amtool \
          alertmanager check-config /etc/alertmanager/alertmanager.yml

      - name: Start core stack
        run: docker compose up -d --build app db nginx

      - name: Check health endpoint
        run: |
          curl -f \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 3 \
            localhost/health

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: stack-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::487054650859:role/ops-baseline-github-deploy
          aws-region: us-east-1


      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd ~/ops-baseline",
              "git pull",
              "docker compose up -d --build app"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
